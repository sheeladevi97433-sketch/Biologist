<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087f5b">

<title>🧬 Biologist - NEET + Veterinary Study Hub</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --green:#087f5b;
  --green2:#11966a;
  --deep:#064e3b;
  --ink:#17332b;
  --bg:#eefaf4;
  --card:#ffffff;
  --soft:#f0faf5;
  --border:#d8eee2;
  --muted:#60756d;
  --shadow:0 5px 20px rgba(0,0,0,.07);
}

body.dark{
  --green:#18a879;
  --green2:#23c38b;
  --deep:#7ce3bc;
  --ink:#e8fff5;
  --bg:#0c1814;
  --card:#14251f;
  --soft:#193028;
  --border:#28483d;
  --muted:#a9c5ba;
  --shadow:0 5px 20px rgba(0,0,0,.25);
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.7;
  transition:.25s;
  padding-bottom:78px;
}

/* HEADER */

header{
  background:linear-gradient(135deg,#064e3b,#11966a);
  color:white;
  text-align:center;
  padding:27px 12px 25px;
  border-radius:0 0 28px 28px;
  box-shadow:0 5px 18px rgba(0,0,0,.12);
}

header h1{
  margin:0;
  font-size:36px;
}

header p{
  margin:3px 0;
  opacity:.94;
}

.header-tools{
  margin-top:12px;
}

.theme-btn{
  background:rgba(255,255,255,.18);
  color:white;
  border:1px solid rgba(255,255,255,.3);
  padding:8px 14px;
}

/* GENERAL */

.container{
  max-width:850px;
  margin:auto;
  padding:16px;
}

.card,
.chapter-page{
  background:var(--card);
  padding:20px;
  margin:12px 0;
  border-radius:18px;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
  transition:.25s;
}

.card:hover{
  transform:translateY(-2px);
}

h2{
  color:var(--deep);
  line-height:1.35;
}

h3{
  color:var(--deep);
}

button{
  cursor:pointer;
  border:0;
  border-radius:12px;
  font-size:16px;
  padding:13px;
  font-weight:bold;
  transition:.2s;
}

button:active{
  transform:scale(.98);
}

.class-btn{
  width:100%;
  margin:7px 0;
  background:linear-gradient(135deg,#087f5b,#11966a);
  color:white;
  padding:17px;
  box-shadow:0 4px 12px rgba(8,127,91,.18);
}

.subject-btn,
.chapter-btn{
  width:100%;
  margin:6px 0;
  padding:14px;
  text-align:left;
  background:var(--soft);
  color:var(--deep);
  border:1px solid var(--border);
}

.chapter-btn{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.chapter-name{
  flex:1;
}

.bookmark-icon{
  font-size:20px;
}

.back-btn{
  background:#24463a;
  color:white;
  margin-bottom:10px;
}

.admin-btn{
  background:#e8f0ff;
  color:#174ea6;
}

.save-btn{
  background:#087f5b;
  color:white;
}

.danger{
  background:#b42318;
  color:white;
}

.hide{
  display:none!important;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid var(--border);
  border-radius:11px;
  font-size:16px;
  background:var(--card);
  color:var(--ink);
}

textarea{
  min-height:170px;
}

.small{
  font-size:13px;
  color:var(--muted);
}

.info{
  background:var(--soft);
  padding:14px;
  border-radius:12px;
  border:1px solid var(--border);
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.row button{
  flex:1;
}

/* HOME */

.hero-card{
  background:
    linear-gradient(135deg,rgba(8,127,91,.12),rgba(17,150,106,.04)),
    var(--card);
}

.hero-badge{
  display:inline-block;
  background:#dff6eb;
  color:#076647;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

body.dark .hero-badge{
  background:#204438;
  color:#b7f3db;
}

.feature-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}

.feature{
  background:var(--soft);
  border:1px solid var(--border);
  border-radius:13px;
  padding:12px;
  text-align:center;
  font-size:14px;
}

/* CONTINUE */

.continue-card{
  border-left:5px solid var(--green);
}

.continue-btn{
  background:var(--green);
  color:white;
  width:100%;
}

/* PROGRESS */

.progress-wrap{
  margin:12px 0;
}

.progress-bar{
  height:10px;
  background:var(--border);
  border-radius:20px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#087f5b,#23c38b);
  transition:.4s;
}

/* NOTES */

.note{
  background:var(--card);
  padding:16px;
  margin:13px 0;
  border:1px solid var(--border);
  border-radius:14px;
  overflow-wrap:anywhere;
  box-shadow:0 3px 12px rgba(0,0,0,.04);
}

.note img{
  max-width:100%;
  height:auto;
  border-radius:10px;
  margin-top:12px;
  border:1px solid var(--border);
}

.reading-tools{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  background:var(--soft);
  padding:10px;
  border-radius:12px;
  margin:12px 0;
  position:sticky;
  top:5px;
  z-index:5;
}

.reading-tools span{
  margin-right:auto;
  font-weight:bold;
}

.reader-btn{
  background:var(--card);
  border:1px solid var(--border);
  color:var(--deep);
  padding:8px 12px;
  font-size:14px;
}

.reading-content{
  font-size:18px;
  line-height:1.9;
}

.pdf-button{
  display:inline-block;
  background:#e8f1ff;
  color:#174ea6;
  padding:11px 14px;
  border-radius:10px;
  margin:10px 0;
  text-decoration:none;
  font-weight:bold;
}

.neet-box{
  background:#fff7dc;
  border-left:5px solid #f0b429;
  padding:13px;
  border-radius:10px;
  margin:12px 0;
  color:#503b00;
}

body.dark .neet-box{
  background:#3
