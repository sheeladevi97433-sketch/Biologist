<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>🧬 Biologist - NEET + Veterinary</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eefaf7;
  color:#123;
}

header{
  background:#087f5b;
  color:white;
  text-align:center;
  padding:25px 15px;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  margin:5px 0 0;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:18px;
  margin:12px 0;
  border-radius:15px;
  box-shadow:0 3px 10px #bbb;
}

h2{
  color:#087f5b;
}

button{
  border:0;
  border-radius:9px;
  cursor:pointer;
  font-size:16px;
}

.class-btn{
  width:100%;
  padding:18px;
  margin:8px 0;
  background:#087f5b;
  color:white;
}

.subject-btn{
  width:100%;
  padding:15px;
  margin:7px 0;
  text-align:left;
  background:#087f5b;
  color:white;
}

.chapter-btn{
  width:100%;
  padding:14px;
  margin:6px 0;
  text-align:left;
  background:#f1f8f6;
  color:#123;
  border:1px solid #c9e5dc;
}

.chapter-btn:hover{
  background:#dff3ec;
}

.back-btn{
  background:#444;
  color:white;
  padding:11px 16px;
  margin-bottom:10px;
}

.hide{
  display:none;
}

.chapter-page{
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 3px 10px #bbb;
}

.chapter-page h2{
  margin-top:0;
}

.info{
  background:#e8f8f5;
  padding:15px;
  border-left:5px solid #087f5b;
  border-radius:8px;
}

</style>

</head>

<body>


<!-- HEADER -->

<header>

<h1>🧬 Biologist</h1>

<p>NEET + Veterinary Study Hub</p>

</header>


<!-- HOME -->

<div id="home" class="container">

<div class="card">

<h2>📚 Welcome to Biologist</h2>

<p>
Class 11 और Class 12 के Biology, Physics,
Chemistry और Veterinary chapters यहाँ पढ़ें।
</p>

</div>

<button
class="class-btn"
onclick="openClass('class11')">

📘 Class 11

</button>


<button
class="class-btn"
onclick="openClass('class12')">

📗 Class 12

</button>

</div>



<!-- CLASS 11 -->

<div id="class11" class="container hide">

<button
class="back-btn"
onclick="goHome()">

⬅ Back

</button>

<div class="card">

<h2>📘 Class 11</h2>

<button
class="subject-btn"
onclick="openSubject('bio11')">

🧬 Biology

</button>

<button
class="subject-btn"
onclick="openSubject('phy11')">

⚡ Physics

</button>

<button
class="subject-btn"
onclick="openSubject('chem11')">

🧪 Chemistry

</button>

<button
class="subject-btn"
onclick="openSubject('vet11')">

🐄 Veterinary

</button>

</div>

</div>



<!-- CLASS 12 -->

<div id="class12" class="container hide">

<button
class="back-btn"
onclick="goHome()">

⬅ Back

</button>

<div class="card">

<h2>📗 Class 12</h2>

<button
class="subject-btn"
onclick="openSubject('bio12')">

🧬 Biology

</button>

<button
class="subject-btn"
onclick="openSubject('phy12')">

⚡ Physics

</button>

<button
class="subject-btn"
onclick="openSubject('chem12')">

🧪 Chemistry

</button>

<button
class="subject-btn"
onclick="openSubject('vet12')">

🐄 Veterinary

</button>

</div>

</div>



<!-- SUBJECT -->

<div id="subjectPage" class="container hide">

<button
class="back-btn"
onclick="backToClass()">

⬅ Back

</button>

<div class="card">

<h2 id="subjectTitle"></h2>

<p id="chapterCount"></p>

<div id="chapterList"></div>

</div>

</div>



<!-- CHAPTER -->

<div id="chapterPage" class="container hide">

<button
class="back-btn"
onclick="backToSubject()">

⬅ Back to Chapters

</button>

<div class="chapter-page">

<h2 id="chapterTitle"></h2>

<div class="info">

📚 इस chapter के notes यहाँ जोड़े जाएंगे।

<br><br>

📝 Chapter खुल गया है।

</div>

</div>

</div>



<script>


/* =========================
   ALL CHAPTERS
========================= */

const chapters = {


/* CLASS 11 BIOLOGY */

bio11: [

"The Living World",

"Biological Classification",

"Plant Kingdom",

"Animal Kingdom",

"Morphology of Flowering Plants",

"Anatomy of Flowering Plants",

"Structural Organisation in Animals",

"Cell: The Unit of Life",

"Biomolecules",

"Cell Cycle and Cell Division",

"Transport in Plants",

"Mineral Nutrition",

"Photosynthesis in Plants",

"Respiration in Plants",

"Plant Growth and Development",

"Digestion and Absorption",

"Breathing and Exchange of Gases",

"Body Fluids and Circulation",

"Excretory Products and Their Elimination",

"Locomotion and Movement",

"Neural Control and Coordination",

"Chemical Coordination and Integration"

],


/* CLASS 11 PHYSICS */

phy11: [

"Units and Measurements",

"Motion in a Straight Line",

"Motion in a Plane",

"Laws of Motion",

"Work, Energy and Power",

"System of Particles and Rotational Motion",

"Gravitation",

"Mechanical Properties of Solids",

"Mechanical Properties of Fluids",

"Thermal Properties of Matter",

"Thermodynamics",

"Kinetic Theory",

"Oscillations",

"Waves"

],


/* CLASS 11 CHEMISTRY */

chem11: [

"Some Basic Concepts of Chemistry",

"Structure of Atom",

"Classification of Elements and Periodicity in Properties",

"Chemical Bonding and Molecular Structure",

"Thermodynamics",

"Equilibrium",

"Redox Reactions",

"Organic Chemistry – Basic Principles and Techniques",

"Hydrocarbons"

],


/* CLASS 11 VETERINARY */

vet11: [

"Animal Science",

"Veterinary Biology",

"Animal Scientific Names",

"Veterinary Important Topics",

"Veterinary Model Papers"

],



/* CLASS 12 BIOLOGY */

bio12: [

"Sexual Reproduction in Flowering Plants",

"Human Reproduction",

"Reproductive Health",

"Principles of Inheritance and Variation",

"Molecular Basis of Inheritance",

"Evolution",

"Human Health and Disease",

"Strategies for Enhancement in Food Production",

"Microbes in Human Welfare",

"Biotechnology: Principles and Processes",

"Biotechnology and Its Applications",

"Organisms and Populations",

"Ecosystem",

"Biodiversity and Conservation"

],


/* CLASS 12 PHYSICS */

phy12: [

"Electric Charges and Fields",

"Electrostatic Potential and Capacitance",

"Current Electricity",

"Moving Charges and Magnetism",

"Magnetism and Matter",

"Electromagnetic Induction",

"Alternating Current",

"Electromagnetic Waves",

"Ray Optics and Optical Instruments",

"Wave Optics",

"Dual Nature of Radiation and Matter",

"Atoms",

"Nuclei",

"Semiconductor Electronics"

],


/* CLASS 12 CHEMISTRY */

chem12: [

"Solutions",

"Electrochemistry",

"Chemical Kinetics",

"Surface Chemistry",

"General Principles and Processes of Isolation of Elements",

"p-Block Elements",

"d- and f-Block Elements",

"Coordination Compounds",

"Haloalkanes and Haloarenes",

"Alcohols, Phenols and Ethers",

"Aldehydes, Ketones and Carboxylic Acids",

"Amines",

"Biomolecules",

"Polymers",

"Chemistry in Everyday Life"

],


/* CLASS 12 VETERINARY */

vet12: [

"Veterinary Biology",

"Animal Anatomy Basics",

"Animal Physiology Basics",

"Animal Nutrition",

"Animal Scientific Names",

"Veterinary Important Topics",

"Veterinary Model Papers"

]

};



/* =========================
   SUBJECT NAMES
========================= */

const subjectNames = {

bio11:"🧬 Class 11 Biology",

phy11:"⚡ Class 11 Physics",

chem11:"🧪 Class 11 Chemistry",

vet11:"🐄 Class 11 Veterinary",

bio12:"🧬 Class 12 Biology",

phy12:"⚡ Class 12 Physics",

chem12:"🧪 Class 12 Chemistry",

vet12:"🐄 Class 12 Veterinary"

};


let currentSubject = "";

let currentClass = "";



/* =========================
   SHOW ONLY ONE PAGE
========================= */

function hideAll(){

document
.querySelectorAll(".container")
.forEach(function(page){

page.classList.add("hide");

});

}



/* =========================
   HOME
========================= */

function goHome(){

hideAll();

document
.getElementById("home")
.classList.remove("hide");

window.scrollTo(0,0);

}



/* =========================
   OPEN CLASS
========================= */

function openClass(classId){

hideAll();

document
.getElementById(classId)
.classList.remove("hide");

currentClass = classId;

window.scrollTo(0,0);

}



/* =========================
   OPEN SUBJECT
========================= */

function openSubject(subjectId){

currentSubject = subjectId;

hideAll();

document
.getElementById("subjectPage")
.classList.remove("hide");

document
.getElementById("subjectTitle")
.innerText =
subjectNames[subjectId];

const list =
chapters[subjectId];

document
.getElementById("chapterCount")
.innerText =
list.length + " Chapters";

const chapterList =
document.getElementById("chapterList");

chapterList.innerHTML = "";


/* CREATE CHAPTER BUTTONS */

list.forEach(function(chapter,index){

const button =
document.createElement("button");

button.className =
"chapter-btn";

button.innerText =
(index + 1) + ". " + chapter;


/* CHAPTER CLICK */

button.onclick = function(){

openChapter(chapter);

};


chapterList.appendChild(button);

});

window.scrollTo(0,0);

}



/* =========================
   OPEN CHAPTER
========================= */

function openChapter(chapterName){

hideAll();

document
.getElementById("chapterPage")
.classList.remove("hide");

document
.getElementById("chapterTitle")
.innerText =
chapterName;

window.scrollTo(0,0);

}



/* =========================
   BACK TO SUBJECT
========================= */

function backToSubject(){

openSubject(currentSubject);

}



/* =========================
   BACK TO CLASS
========================= */

function backToClass(){

hideAll();

document
.getElementById(currentClass)
.classList.remove("hide");

window.scrollTo(0,0);

}



/* =========================
   START WEBSITE
========================= */

goHome();


</script>

</body>
  </html>
