<head>

<title>Biologist – Class 11 & 12 Biology Notes in Hindi | UP Board, NEET & Veterinary</title>

<meta name="description" content="Biologist पर Class 11 और 12 के Biology, Physics, Chemistry और Veterinary Notes हिंदी में पढ़ें। UP Board और NEET की तैयारी के लिए Chapter-wise Notes, Study Material और PDFs।">

<style>
*{box-sizing:border-box}
:root{--green:#00a878;--deep:#e5c36b;--bg:#080d0c;--card:#111b18;--text:#f3f1e8;--soft:#172720;--border:#355b48;--muted:#a8b7ac;--gold:#d8b65f}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at top,#10291f 0%,#080d0c 65%);color:var(--text);font-family:"Segoe UI",Arial,sans-serif;line-height:1.65;padding-bottom:82px}
body.light{--bg:#f4f7f2;--card:#fff;--text:#17251d;--soft:#eaf2eb;--border:#cbdccf;--muted:#617267;background:#f4f7f2}
.hide{display:none!important}
header{background:linear-gradient(135deg,#030806,#064b35 55%,#98742e);color:#fff;text-align:center;padding:32px 15px;border:1px solid #b99548;border-top:0;border-radius:0 0 30px 30px;box-shadow:0 12px 35px #0008}
header h1{margin:0;font-size:38px;letter-spacing:2px;color:#f6d77e;text-shadow:0 2px 15px #e5bd5540}
header p{margin:3px;color:#eee7d2;letter-spacing:1px}
.container{max-width:900px;margin:auto;padding:16px}
.card,.chapter-page,.assistant-shell,.legal{background:linear-gradient(145deg,var(--card),var(--bg));padding:20px;margin:13px 0;border-radius:20px;border:1px solid var(--border);box-shadow:0 8px 25px #0005}
body.light .card,body.light .chapter-page,body.light .assistant-shell,body.light .legal{background:var(--card);box-shadow:0 5px 18px #19352212}
h2,h3{color:var(--deep);line-height:1.35}
p,li{color:var(--text)}
button{cursor:pointer;border:1px solid transparent;border-radius:12px;padding:12px;font-size:15px;font-weight:700;transition:.22s}
button:hover{transform:translateY(-2px);filter:brightness(1.08)}
.class-btn{width:100%;margin:7px 0;padding:16px;color:#fff;background:linear-gradient(120deg,#075b40,#087f5b,#9a7733);border:1px solid #c4a34e;box-shadow:0 5px 16px #0006}
.subject-btn,.chapter-btn{width:100%;margin:6px 0;padding:14px;text-align:left;background:var(--soft);color:var(--deep);border:1px solid var(--border)}
.chapter-btn{display:flex;justify-content:space-between;gap:12px}
.back-btn{background:#173d2c;color:#f1d17a;border-color:#987b3e}
.save-btn,.ask-btn{background:linear-gradient(120deg,#087f5b,#00a878);color:#fff;border-color:#b99548}
.admin-btn{background:#1b3023;color:#f1d17a;border-color:#c5a34f}
.danger{background:#762b27;color:#fff}
input,textarea,select{width:100%;padding:13px;margin:7px 0;border:1px solid var(--border);border-radius:11px;background:var(--bg);color:var(--text);font-size:16px}
textarea{min-height:170px}
.info,.assistant-box,.saved-item{background:var(--soft);padding:14px;border-radius:12px;margin:8px 0;border:1px solid var(--border)}
.badge{display:inline-block;padding:5px 10px;border-radius:20px;background:#254b36;color:#f2d17b;border:1px solid #a88943;font-size:12px;font-weight:bold}
.features{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.feature{background:linear-gradient(145deg,#1a3024,#101a14);padding:14px;border-radius:14px;text-align:center;font-weight:bold;color:#f1d17a;border:1px solid #876e39}
.progress{height:11px;background:var(--border);border-radius:20px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#087f5b,#00c995,#e5c36b);width:0}
.chapter-head{display:flex;align-items:center;gap:8px}
.chapter-head h2{flex:1}
.bookmark{font-size:22px;color:#e2a500;background:var(--soft);border-color:#a98b46}
.reading-tools,.quick{display:flex;gap:7px;flex-wrap:wrap;background:var(--soft);padding:10px;border-radius:12px}
.reader-btn{background:var(--card);color:var(--deep);border:1px solid var(--border)}
.note,.ai-result{background:var(--card);padding:16px;margin:12px 0;border:1px solid var(--border);border-radius:14px}
.note img{max-width:100%;border-radius:12px;display:block}
.pdf-button{display:inline-block;background:#183a2b;color:#f1d17a;padding:10px 13px;border-radius:10px;margin-top:9px;text-decoration:none;border:1px solid #a58a49}
.small{font-size:13px;color:var(--muted)}
.legal{max-width:850px;margin:25px auto;padding:20px}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:650px;height:70px;background:#080f0b;border:1px solid #806b3e;border-bottom:0;display:flex;z-index:10;border-radius:20px 20px 0 0;box-shadow:0 -8px 28px #0009}
.nav-btn{flex:1;background:transparent;color:#c4b98d;font-size:11px;padding:5px}
.nav-btn span{display:block;font-size:18px}
footer{margin-top:30px;padding:20px;background:linear-gradient(120deg,#030906,#064b35,#101710);border-top:1px solid #b99548;color:#f1d17a;text-align:center;font-size:13px}
#topBtn{position:fixed;right:15px;bottom:82px;display:none;background:linear-gradient(135deg,#087f5b,#b99548);color:white;border-radius:50%;width:44px;height:44px;border:1px solid #f1d17a;z-index:9}
.assistant-shell{padding:18px}
.assistant-hero{display:flex;align-items:center;gap:14px;padding:18px;margin:-18px -18px 18px;background:linear-gradient(120deg,#041a11,#087f5b,#a17c32);color:white;border-radius:21px 21px 0 0;border:1px solid #c3a14c}
.assistant-hero h2{color:#f7d982;margin:5px 0 0}
.assistant-hero p{margin:2px 0;color:#e4fff3;font-size:14px}
.assistant-orb{display:grid;place-items:center;width:58px;height:58px;border-radius:18px;background:#ffffff25;border:1px solid #e5c36b;font-size:30px}
.assistant-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.assistant-controls label,.assistant-label{font-weight:bold;font-size:13px;color:var(--deep)}
.assistant-shell textarea{min-height:86px;resize:vertical}
.assistant-actions{display:flex;gap:8px}
.assistant-actions .ask-btn{flex:1}
.assistant-tip{margin:8px 0 14px}
.quick-title{font-weight:bold;color:var(--deep);font-size:14px;margin-bottom:7px}
.quick button{background:var(--card);border:1px solid var(--border);color:var(--deep);font-size:13px;padding:9px}
.assistant-foot{text-align:center;color:var(--muted);font-size:11px;border-top:1px solid var(--border);padding-top:12px;margin-top:16px}
.answer-heading{font-weight:bold;color:var(--deep);margin:14px 0 6px}
.answer-source{font-size:12px;color:var(--muted);margin-top:8px}
.ai-result{line-height:1.8;border-left:4px solid var(--green);white-space:pre-wrap}
@media(min-width:700px){.features{grid-template-columns:repeat(4,1fr)}}
@media(max-width:520px){header h1{font-size:32px}.container{padding:12px}.card,.chapter-page{padding:16px}.assistant-controls{grid-template-columns:1fr}.bottom-nav{height:68px}}
</style>
</head>
