<h3>1. Biology</h3>

<p>
Biology जीवों तथा उनके जीवन का वैज्ञानिक अध्ययन है।
</p>

<ul>
<li><b>Bio / Bios</b> = Life</li>
<li><b>Logos</b> = Study</li>
</ul>


<h3>2. Biology की प्रमुख शाखाएँ</h3>

<ul>
<li><b>Botany</b> — पौधों का अध्ययन</li>
<li><b>Zoology</b> — जन्तुओं का अध्ययन</li>
<li><b>Microbiology</b> — सूक्ष्मजीवों का अध्ययन</li>
<li><b>Morphology</b> — बाहरी संरचना</li>
<li><b>Anatomy</b> — आंतरिक संरचना</li>
<li><b>Cytology</b> — कोशिका का अध्ययन</li>
<li><b>Histology</b> — ऊतकों का अध्ययन</li>
<li><b>Physiology</b> — शारीरिक क्रियाओं का अध्ययन</li>
<li><b>Genetics</b> — आनुवंशिकता का अध्ययन</li>
<li><b>Ecology</b> — जीव और पर्यावरण के संबंध</li>
<li><b>Taxonomy</b> — पहचान, नामकरण और वर्गीकरण</li>
</ul>


<h3>3. What is Living?</h3>

<p>
जीवित जीवों में कुछ विशेष लक्षण पाए जाते हैं
जो उन्हें निर्जीव वस्तुओं से अलग करते हैं।
</p>

<div class="highlight">

<b>मुख्य Life Characteristics:</b><br>

Growth + Reproduction + Metabolism +
Cellular Organisation + Consciousness

</div>


<h3>4. Growth — वृद्धि</h3>

<p>
जीवों के आकार तथा द्रव्यमान में वृद्धि को Growth कहते हैं।
</p>


<h3>5. Reproduction — प्रजनन</h3>

<p>
जीवों द्वारा अपने समान नई संतति उत्पन्न करने की प्रक्रिया
Reproduction कहलाती है।
</p>

<ul>
<li><b>Asexual Reproduction</b></li>
<li><b>Sexual Reproduction</b></li>
</ul>


<div class="example">

<b>Important:</b>
Reproduction individual organism के लिए अनिवार्य नहीं है।

</div>


<h3>6. Metabolism — उपापचय</h3>

<p>
जीव के शरीर में होने वाली सभी रासायनिक क्रियाओं के कुल योग को
Metabolism कहते हैं।
</p>

<ul>
<li><b>Anabolism</b> — निर्माणात्मक क्रियाएँ</li>
<li><b>Catabolism</b> — अपघटनात्मक क्रियाएँ</li>
</ul>


<h3>7. Cellular Organisation</h3>

<p>
कोशिका जीवन की मूलभूत संरचनात्मक और क्रियात्मक इकाई है।
</p>

<ul>
<li><b>Unicellular</b> — एक कोशिका वाले जीव</li>
<li><b>Multicellular</b> — अनेक कोशिकाओं वाले जीव</li>
</ul>


<h3>8. Consciousness — चेतना</h3>

<p>
जीव अपने वातावरण में होने वाले परिवर्तनों को महसूस कर सकते हैं
और उनके प्रति प्रतिक्रिया दे सकते हैं।
</p>


<h3>9. Biodiversity — जैव विविधता</h3>

<p>
पृथ्वी पर पाए जाने वाले विभिन्न प्रकार के जीवों की विविधता को
Biodiversity कहते हैं।
</p>


<h3>10. Taxonomy</h3>

<p>
जीवों की <b>Identification, Nomenclature और Classification</b>
के अध्ययन को Taxonomy कहते हैं।
</p>


<h3>11. Systematics</h3>

<p>
Systematics में जीवों की विविधता तथा उनके संबंधों का अध्ययन किया जाता है।
</p>


<h3>12. Taxonomic Hierarchy</h3>

<div class="hierarchy">

↓<br>

↓<br>

↓<br>
Genus<br>
↓<br>
Species

</div>


<h3>13. Species</h3>

<p>
Species taxonomic hierarchy की मूलभूत इकाई है।
</p>

</div>


<h3>14. Binomial Nomenclature</h3>

<p>
जिस वैज्ञानिक नामकरण पद्धति में किसी जीव का नाम दो शब्दों में लिखा जाता है,
उसे Binomial Nomenclature कहते हैं।
</p>


<div class="example">

<b>Homo sapiens</b><br>
Homo = Genus<br>
